{% extends 'layout/base_limpa.html' %}
{% block title %} Tela de login {% endblck %}

{% block conteudo %}
 <main class="login-card">
        <div class="login-logo">AL</div>

        <h1>App Loja</h1>
        <p class="login-descricao">Entre para acessar o sistema.</p>

        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST" class="form-login">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar</button>
        </form>

        <div class="dados-teste">
            <strong>Usuário de teste</strong>
            <span>E-mail: admin@loja.com</span>
            <span>Senha: 123</span>
        </div>
    </main>
{% endblock %}
