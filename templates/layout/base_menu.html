<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}App Loja{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body>

    <header class="topbar">
        <a href="{{ url_for('dashboard') }}" class="logo">
            App Loja
        </a>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>

            <!-- Menu de produtos com opções de listagem e cadastro. -->
            <div class="menu-dropdown">
                <a href="{{ url_for('listar_produtos') }}" class="menu-link">
                    Produtos <span class="seta">▼</span>
                </a>

                <div class="submenu">
                    <a href="{{ url_for('listar_produtos') }}">
                        Listagem de Produtos
                    </a>

                    <a href="{{ url_for('cadastrar_produto') }}">
                        Cadastro de Produtos
                    </a>
                </div>
            </div>

            <!-- Menu de usuários mantido no mesmo padrão. -->
            <div class="menu-dropdown">
                <a href="#" class="menu-link">
                    Usuários <span class="seta">▼</span>
                </a>

                <div class="submenu">
                    <a href="{{ url_for('listar_usuarios') }}">
                        Listagem de Usuários
                    </a>

                    <a href="{{ url_for('cadastrar_usuario') }}">
                        Cadastro de Usuários
                    </a>
                </div>
            </div>

            <a href="{{ url_for('logout') }}">Sair</a>
        </nav>
    </header>

    <!-- Cada página preenche este bloco com seu próprio conteúdo. -->
    <main class="conteudo">
         <div class="col-12 col-md-8 col-lg-5">
      {% for tipo, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ tipo }} alert-dismissible fade show" role="alert">
        {{ mensagem }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
      {% endfor %}
    {% block content %}{% endblock %}
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
