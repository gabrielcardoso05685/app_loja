{% extends 'layout/base_menu.html' %}

{% block titulo_aba %}Novo produto — APP LOJA{% endblock %}

{% block conteudo %}
<h1 class="h2 mb-4">Novo produto</h1>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">

                <form action="{{ url_for('inserir_produto') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  
                        <label for="nome" class="form-label">Nome do produto</label>
                        <input value="{{ nome }}" minlength="3" required>
                        <input type="text" name="nome" id="nome" class="form-control" mb-3>
                    

                    
                        <label for="descricao" class="form-label">Descrição (opcional)</label>
                        <textarea class="form-control" id="descricao" name="descricao">{{ descricao or '' }}</textarea>
                    

                    <div class="d-flex justify-content-between gap-2">
                        <a href="{{ url_for('listar_perfis') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar perfil</button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
