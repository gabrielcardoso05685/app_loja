{% extends 'layout/base_menu.html' %}
{% block titulo%} Perfil {% endblock %}

{% block conteudo %}

<div class="card" style="width: 600px">
  <div class="card-header bg-primary">
    Cadastro de Perfil
  </div>
  <div class="card-body p-3">
   <form action="" method="post">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome do Perfil</label>
        <input type="text" name="nome" id="nome" class="form-control mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea name="descricao" id="descricao" class="form-control mb-3"></textarea>
        <div class="d-flex justify-content-between">
            <a href="{{url_for('listar_perfis')}}" class="btn btn-light">Voltar</a>
            
            <button type="submit" class="btn btn-success">Salvar</button>

        </div>
      </div>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
  </div>
</div>

{% endblock %}
